<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #ffffff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
    color: #000;
  }
  /* 顶部红色标题（一行） */
  .red-title {
    color: #e60012;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.5;
    text-align: center;
    margin-bottom: 20px;
  }
  /* 黑色正文：每行最多 65 个中文字符，超出自动换行 */
  .body-text {
    color: #000000;
    font-size: 16px;
    line-height: 1.8;
    max-width: 65em;          /* 约 65 个中文字符宽度 */
    width: 100%;
    text-align: justify;
    margin-bottom: 36px;
    word-break: break-word;
  }
  /* 中间大号加粗数字（可自定义） */
  .big-number {
    font-size: 72px;
    font-weight: 800;
    color: #000000;
    line-height: 1.1;
    text-align: center;
    margin-bottom: 40px;
    padding: 4px 12px;
    outline: none;
    border-radius: 8px;
    cursor: text;
  }
  .big-number:focus { background: #f5f5f5; }
  .big-number::after {
    content: "";
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: #999;
    margin-top: 10px;
  }
  /* 二维码：1:1 原尺寸，不变形；小屏等比缩放 */
  .qr-wrap {
    margin-top: 8px;
  }
  .qr-wrap img {
    display: block;
    width: 674px;          /* 原始宽度，1:1 不缩放变形 */
    max-width: 100%;       /* 窄屏等比适配，不拉伸 */
    height: auto;
  }
</style>
</head>
